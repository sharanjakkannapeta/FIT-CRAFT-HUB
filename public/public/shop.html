<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop - FIT CRAFT HUB</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f0f0f;
      color:white;
    }

    .navbar{
      background:#111;
      padding:15px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .navbar a{
      color:white;
      text-decoration:none;
      margin-left:20px;
    }

    .hero{
      text-align:center;
      padding:50px 20px;
    }

    .products-grid{
      width:90%;
      margin:auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding-bottom:50px;
    }

    .product-card{
      background:#1a1a1a;
      border-radius:12px;
      padding:15px;
      border:1px solid #333;
      transition:0.3s;
    }

    .product-card:hover{
      transform:translateY(-5px);
    }

    .product-card img{
      width:100%;
      height:250px;
      object-fit:cover;
      border-radius:10px;
    }

    .product-card h3{
      margin-top:15px;
      font-size:18px;
    }

    .product-card p{
      color:#00ff99;
      font-size:20px;
      font-weight:bold;
    }

    .loading{
      text-align:center;
      font-size:22px;
      padding:40px;
    }

  </style>

</head>

<body>

  <!-- Navbar -->

  <div class="navbar">

    <h2>FIT CRAFT HUB</h2>

    <div>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
    </div>

  </div>

  <!-- Hero -->

  <div class="hero">

    <h1>Shop Products</h1>

    <p>Premium fitness products and accessories</p>

  </div>

  <!-- Products -->

  <div id="products-container" class="products-grid">

    <div class="loading">
      Loading Products...
    </div>

  </div>

  <!-- Script -->

  <script>

    async function loadProducts() {

      const container = document.getElementById("products-container");

      try {

        const response = await fetch("/api/products");

        const products = await response.json();

        console.log(products);

        container.innerHTML = "";

        if(products.length === 0){

          container.innerHTML = `
            <div class="loading">
              No Products Found
            </div>
          `;

          return;

        }

        products.forEach(product => {

          container.innerHTML += `

            <div class="product-card">

              <img src="${product.image}" alt="${product.name}">

              <h3>${product.name}</h3>

              <p>₹${product.price}</p>

            </div>

          `;

        });

      } catch(error) {

        console.log(error);

        container.innerHTML = `
          <div class="loading">
            Error Loading Products
          </div>
        `;

      }

    }

    loadProducts();

  </script>

</body>
</html>
