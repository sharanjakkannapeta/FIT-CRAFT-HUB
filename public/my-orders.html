<!DOCTYPE html>
<html>
<head>
  <title>My Orders</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    .box {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px;
      width: 100%;
      background: black;
      color: white;
      border: none;
    }

    .order {
      border: 1px solid #ddd;
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Track Your Orders</h2>

  <input id="phone" placeholder="Enter Phone Number">
  <button onclick="getOrders()">Check Orders</button>

  <div id="orders"></div>
</div>

<script>
async function getOrders() {
  let phone = document.getElementById("phone").value;

  const res = await fetch("/api/orders/my-orders/" + phone);
  const data = await res.json();

  let output = "";

  if (data.length === 0) {
    output = "<p>No orders found</p>";
  }

  data.forEach(order => {
    output += `
      <div class="order">
        <p><b>Order ID:</b> ${order._id}</p>
        <p><b>Amount:</b> ₹${order.amount}</p>
        <p><b>Status:</b> ${order.status}</p>
        <p><b>Payment:</b> ${order.paymentMethod}</p>
      </div>
    `;
  });

  document.getElementById("orders").innerHTML = output;
}
</script>

</body>
</html>
